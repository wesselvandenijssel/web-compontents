<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/svg+xml" href="./vite.svg" />
    <link rel="stylesheet" href="./global-styles.css" />

    <title>Lit Web Components</title>

    <script type="module" src="./src/view/pages/home-page.js"></script>
  </head>
  <body>
    <hello-lit></hello-lit>
    <h1>Outside in the index.html</h1>
    <hello-styles></hello-styles>

    <lit-attributes
      name="Jan"
      customer-id="123"
      date-of-birth="2004-03-04"
    ></lit-attributes>
    <lit-attributes
      name="Nadia"
      customer-id="321"
      date-of-birth="2005-02-28"
      online
    ></lit-attributes>

    <lit-events></lit-events>

    <main>
      <lit-render reactiveProperty="Some Value">
        <input type="text" placeholder="Enter text" id="attrInput" />
        <button id="attrBtn" type="button">Set Attribute value</button>
      </lit-render>
    </main>

    <col-helper></col-helper>

    <countdown-timer></countdown-timer>

    <evaluation-form></evaluation-form>
  </body>
</html>
